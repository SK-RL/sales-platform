# job-apply — LOCAL profile.
#
# Deliberately small. The platform's Answer Book is the source of truth
# for question→answer (see answers.md); this file holds only what the
# Answer Book cannot: a path on this machine, plus the identity fields
# that appear on literally every form and are faster read locally than
# fetched.
#
# Copy to profile.yaml (git-ignored) and fill. Never guess a value —
# leave it blank and the skill will ask you once and save the answer to
# the Answer Book.

identity:
  first_name: "<First>"
  last_name: "<Last>"
  preferred_name: ""            # only if a form asks

contact:
  email: "<you@domain.com>"
  phone: "<+971 5x xxx xxxx>"   # include country code
  city: "<Dubai>"
  country: "<United Arab Emirates>"

links:
  linkedin: "<https://www.linkedin.com/in/...>"   # asked on 141 forms in our corpus
  website: ""                                    # asked on 76 — portfolio, blog or GitHub
  github: ""

# The only genuinely local thing: the file uploaded on every application.
resume:
  path: "</absolute/path/to/Resume.pdf>"

# Facts used to ground free-text answers. Be specific — names, numbers,
# tools. Generic entries produce generic answers, which is exactly what
# voice.md is trying to avoid. Anything here must be true.
experience:
  current_title: "<Senior DevOps Engineer>"
  current_company: "<Company>"        # asked on 13 forms in our corpus
  years_total: "<8>"
  headline: "<one plain sentence about what you actually do>"
  core_stack: ["<AWS>", "<Kubernetes>", "<Terraform>", "<Python>"]
  projects:
    - name: "<Migration of X to Y>"
      what: "<what you did, one or two lines>"
      result: "<a number: cost, latency, uptime, headcount, time>"
      tools: ["<Terraform>", "<EKS>"]

# Small conveniences that aren't worth a round trip.
defaults:
  how_did_you_hear: "Company careers page"   # asked on 41 forms in our corpus
  worked_here_before: "no"
  referred_by: ""

# NOT here on purpose — these live in the Answer Book as the 16 locked
# required entries, because the platform requires them to be provably
# user-chosen: salary minima (global/USA/UAE/remote), notice period,
# earliest start, work authorization, sponsorship, relocation, work
# mode, current location, and the four EEO questions.
# Fill them via the answer-book setup screen. See answers.md.
